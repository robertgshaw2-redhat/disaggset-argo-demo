# Synced by Argo CD (../argo/application.yaml) into the Application's destination namespace: the router, the qwen
# DisaggregatedSet, and the driver Rollout with its step runner. No namespace here: every name resolves in that
# namespace. model-server/qwen.yaml and rollout/rollout.yaml are generated by gen.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: pd-demo
    includeSelectors: false
    includeTemplates: false

configMapGenerator:
  - name: pd-demo-epp
    files:
      - router/routing.yaml
  - name: pd-demo-envoy
    files:
      - router/envoy.yaml
  # Referenced by the AnalysisTemplate (a CRD kustomize does not rewrite), so a fixed name.
  - name: pd-demo-steps
    files:
      - rollout/steps.py
    options:
      disableNameSuffixHash: true

resources:
  - router/router.yaml
  - model-server/resource-claim.yaml
  - model-server/qwen.yaml
  - rollout/steps.yaml
  - rollout/rollout.yaml
