# Variant 1, Argo Rollouts: the workload plus a driver Rollout whose steps set the DisaggregatedSet's canaryPercent
# (rollout/steps.py, server-side apply as its own field manager). Git never sets canaryPercent in this variant.
# rollout/rollout.yaml is generated by ../gen.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - rollout/steps.yaml
  - rollout/rollout.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: pd-demo
    includeSelectors: false
    includeTemplates: false

configMapGenerator:
  # Referenced by the AnalysisTemplate (a CRD kustomize does not rewrite), so a fixed name.
  - name: pd-demo-steps
    files:
      - rollout/steps.py
    options:
      disableNameSuffixHash: true
