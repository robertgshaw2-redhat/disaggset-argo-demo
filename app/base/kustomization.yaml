# The workload, shared by both ways of driving a release (../rollouts and ../kargo): the router and the qwen
# DisaggregatedSet. No namespace here: every name resolves in the Argo CD Application's destination namespace.
# model-server/qwen.yaml is generated by ../gen.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: pd-demo
    includeSelectors: false
    includeTemplates: false

configMapGenerator:
  - name: pd-demo-epp
    files:
      - router/routing.yaml
  - name: pd-demo-envoy
    files:
      - router/envoy.yaml

resources:
  - router/router.yaml
  - model-server/resource-claim.yaml
  - model-server/qwen.yaml
